<!doctype html>
<html lang="pt">
<head>
<!--
  SALDO A DOIS — despesas partilhadas
  =====================================
  Esta página guarda as despesas diretamente numa Google Sheet (que faz de
  base de dados), através de um pequeno Apps Script. Ver o ficheiro
  Codigo.gs para as instruções completas de configuração (5 passos).

  Resumindo: cria uma Google Sheet → Extensões → Apps Script → cola o
  Codigo.gs → corre a função "setup" uma vez → Implementar → Aplicação
  Web (Executar como: Eu; Acesso: Qualquer pessoa) → copia o URL /exec e
  cola-o aqui em baixo, na variável APPS_SCRIPT_URL.

  Sem isso configurado, a página funciona à mesma, mas guarda as despesas
  só neste dispositivo (localStorage), sem partilhar com ninguém.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saldo a Dois</title>

<!-- Ícone no separador do browser -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

<!-- "Adicionar ao ecrã principal" — Android/Chrome -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#146857">

<!-- "Adicionar ao ecrã principal" — iPhone/iPad (Safari não lê o manifest.json) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saldo a Dois">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,680&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --ink:#1A1917;
  --ink-soft:#6b6862;
  --paper:#F4F3EF;
  --card:#FFFFFF;
  --line: rgba(26,25,23,.12);
  --line-strong: rgba(26,25,23,.22);
  --accent:#146857;
  --accent-strong:#0E4E41;
  --accent-soft:#E1EFEA;
  --joao:#33499A;
  --joao-soft:#E7EBF8;
  --nadine:#A32B52;
  --nadine-soft:#F7E5EB;
  --danger:#A5391F;
  --danger-soft:#F3E4DE;
  --shadow: 0 1px 2px rgba(26,25,23,.05), 0 8px 20px -12px rgba(26,25,23,.18);
  --radius: 14px;
  --radius-sm: 10px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDEBE6;
    --ink-soft:#A6A29A;
    --paper:#15181A;
    --card:#1D2124;
    --line: rgba(237,235,230,.13);
    --line-strong: rgba(237,235,230,.24);
    --accent:#3FBFA0;
    --accent-strong:#63D3B7;
    --accent-soft: rgba(63,191,160,.15);
    --joao:#93A6EE;
    --joao-soft: rgba(147,166,238,.16);
    --nadine:#EE84A2;
    --nadine-soft: rgba(238,132,162,.16);
    --danger:#E2764F;
    --danger-soft: rgba(226,118,79,.15);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEBE6;
  --ink-soft:#A6A29A;
  --paper:#15181A;
  --card:#1D2124;
  --line: rgba(237,235,230,.13);
  --line-strong: rgba(237,235,230,.24);
  --accent:#3FBFA0;
  --accent-strong:#63D3B7;
  --accent-soft: rgba(63,191,160,.15);
  --joao:#93A6EE;
  --joao-soft: rgba(147,166,238,.16);
  --nadine:#EE84A2;
  --nadine-soft: rgba(238,132,162,.16);
  --danger:#E2764F;
  --danger-soft: rgba(226,118,79,.15);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.5);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  display:flex;
  justify-content:center;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app{ width:100%; max-width:560px; padding:32px 18px 64px; display:flex; flex-direction:column; gap:16px; }
h1,h2,p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
input,button,select{color:var(--ink); font-size:15px;}
input:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
button:disabled{opacity:.55; cursor:default;}

.topbar{padding:0 2px;}
.eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--accent); margin:0 0 4px;}
.title{font-family:var(--font-display); font-weight:680; font-size:30px; letter-spacing:-.01em;}

.status{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); margin-top:8px; }
.status .dot{ width:8px; height:8px; border-radius:50%; background:var(--ink-soft); flex:none; }
.status.ok .dot{ background:var(--accent); }
.status.err .dot{ background:var(--danger); }

.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; }
.card h2{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; color:var(--ink-soft); margin-bottom:14px; }

.headline{ font-family:var(--font-display); font-size:22px; font-weight:600; line-height:1.35; margin-bottom:16px; }
.headline b{ font-weight:680; }
.stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; font-size:14px; }
.stats div{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }
.stats span:last-child{ font-family:var(--font-mono); font-weight:600; }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
.field input{ width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.toggle{ display:flex; gap:8px; }
.toggle button{ flex:1; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); font-weight:600; }
.toggle button[data-active="1"][data-p="JOAO"]{ background:var(--joao-soft); border-color:var(--joao); color:var(--joao); }
.toggle button[data-active="1"][data-p="NADINE"]{ background:var(--nadine-soft); border-color:var(--nadine); color:var(--nadine); }

.split{ display:flex; align-items:center; gap:10px; }
.split .field{ margin-bottom:0; flex:1; }
.split span{ color:var(--ink-soft); font-size:13px; }

.btn-primary{ width:100%; padding:13px; border-radius:var(--radius-sm); border:none; background:var(--accent); color:#fff; font-weight:700; font-size:15px; margin-top:4px; }
.btn-primary:hover{ background:var(--accent-strong); }
.btn-secondary{ padding:9px 14px; border-radius:var(--radius-sm); border:1px solid var(--line-strong); background:transparent; color:var(--ink); font-weight:600; font-size:13.5px; }
.btn-secondary:hover{ background:var(--line); }

.list-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.list-head h2{ margin:0; }
ul.entries{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
ul.entries li{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); }
.entry-main{ display:flex; flex-direction:column; gap:2px; }
.entry-title{ font-weight:600; font-size:14.5px; }
.entry-sub{ font-size:12.5px; color:var(--ink-soft); }
.entry-amount{ font-family:var(--font-mono); font-weight:600; }
.badge{ display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; margin-left:6px; }
.badge.JOAO{ background:var(--joao-soft); color:var(--joao); }
.badge.NADINE{ background:var(--nadine-soft); color:var(--nadine); }
.entry-del{ border:none; background:transparent; color:var(--ink-soft); font-size:17px; line-height:1; padding:4px 6px; border-radius:6px; }
.entry-del:hover{ background:var(--danger-soft); color:var(--danger); }
.empty{ font-size:13.5px; color:var(--ink-soft); padding:6px 2px; border:none !important; }

.footer{ text-align:center; font-size:12px; color:var(--ink-soft); padding-top:8px; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <p class="eyebrow">Despesas partilhadas</p>
    <h1 class="title">Saldo a Dois</h1>
    <div class="status" id="statusBox"><span class="dot"></span><span id="statusText">A ligar…</span></div>
  </div>

  <div class="card">
    <h2>Saldo do mês</h2>
    <p class="headline" id="headline">—</p>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <h2>Nova despesa</h2>
    <div class="field">
      <label for="valor">Valor</label>
      <input id="valor" type="number" step="0.01" min="0" placeholder="0,00" inputmode="decimal">
    </div>
    <div class="row2">
      <div class="field">
        <label for="local">Comerciante / Local</label>
        <input id="local" list="merchantsList" placeholder="ex.: Continente" autocomplete="off">
        <datalist id="merchantsList"></datalist>
      </div>
      <div class="field">
        <label for="categoria">Categoria</label>
        <input id="categoria" list="categoriesList" placeholder="ex.: Supermercado" autocomplete="off">
        <datalist id="categoriesList"></datalist>
      </div>
    </div>
    <div class="field">
      <label for="data">Data</label>
      <input id="data" type="date">
    </div>
    <div class="field">
      <label>Pago por</label>
      <div class="toggle" id="pagoPorToggle">
        <button type="button" data-p="JOAO">João</button>
        <button type="button" data-p="NADINE">Nadine</button>
      </div>
    </div>
    <div class="field">
      <label>Divisão</label>
      <div class="split">
        <div class="field"><label for="pct1">João</label><input id="pct1" type="number" min="0" max="100" value="50"></div>
        <span>/</span>
        <div class="field"><label for="pct2">Nadine</label><input id="pct2" type="number" min="0" max="100" value="50"></div>
      </div>
    </div>
    <button class="btn-primary" id="saveBtn">Guardar despesa</button>
  </div>

  <div class="card">
    <div class="list-head">
      <h2 id="listTitle">Despesas recentes</h2>
    </div>
    <ul class="entries" id="entriesList"></ul>
  </div>

  <p class="footer">Saldo a Dois</p>
</div>

<script>
(function(){
"use strict";

var PEOPLE = { JOAO: "João", NADINE: "Nadine" };

var DEFAULT_MERCHANTS = ["Continente","Pingo Doce","BOLAMA","MERCADONA","VETERINARIA","CAFÉ","Casa","FARMACIA","IUC","Lidl","PRIMOR","RENDA","SEGURO","WELLS","ÁGUA + LUZ","CONTAS","Galp"];
var DEFAULT_CATEGORIES = ["Supermercado","Casa","CONTAS","EMILIO","SAUDE","CARRO","NESPRESSO","PERFUMES","Combustível"];
var MERCH_CAT = {
  "Continente":"Supermercado","Pingo Doce":"Supermercado","Lidl":"Supermercado","Galp":"Combustível",
  "VETERINARIA":"EMILIO","CONTAS":"Casa","Casa":"CONTAS","MERCADONA":"Supermercado","BOLAMA":"Supermercado",
  "FARMACIA":"SAUDE","CAFÉ":"NESPRESSO","PRIMOR":"PERFUMES","WELLS":"SAUDE","SEGURO":"CARRO","IUC":"CARRO",
  "RENDA":"Casa","ÁGUA + LUZ":"Casa"
};

// ---- Configuração do Apps Script -------------------------------------
// Cola aqui o URL /exec obtido no passo 4 do Codigo.gs. Enquanto ficar
// como está, a página funciona em modo local (só neste dispositivo).
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5_9sZCSbG4VhiBqawcTOiSJYmQFPaGPMkq13yL795nhrZAHS5rpN--AkhwWtIuG40/exec";
// ------------------------------------------------------------------------

var sheetsOK = APPS_SCRIPT_URL.indexOf("COLA-AQUI") === -1;
var LOCAL_KEY = "saldoADois.entries";
var entries = [];
var locais = DEFAULT_MERCHANTS.slice();
var categorias = DEFAULT_CATEGORIES.slice();
var pendingPayer = null;
var saving = false;

function setStatus(kind, text) {
  var box = document.getElementById("statusBox");
  box.className = "status " + kind;
  document.getElementById("statusText").textContent = text;
}

function loadLocal() {
  try {
    var raw = localStorage.getItem(LOCAL_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(entries)); } catch (e) {}
}

function fillDatalist(id, list) {
  var dl = document.getElementById(id);
  dl.innerHTML = "";
  list.forEach(function (v) { var o = document.createElement("option"); o.value = v; dl.appendChild(o); });
}

function refresh() {
  if (!sheetsOK) {
    entries = loadLocal();
    render();
    return;
  }
  fetch(APPS_SCRIPT_URL)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) throw new Error(data.error || "erro desconhecido");
      entries = data.entries || [];
      if (data.locais && data.locais.length) locais = uniq(DEFAULT_MERCHANTS.concat(data.locais));
      if (data.categorias && data.categorias.length) categorias = uniq(DEFAULT_CATEGORIES.concat(data.categorias));
      fillDatalist("merchantsList", locais);
      fillDatalist("categoriesList", categorias);
      setStatus("ok", "Sincronizado com a Google Sheet");
      render();
    })
    .catch(function (err) {
      console.error(err);
      setStatus("err", "Sem ligação à Google Sheet — a tentar de novo em breve.");
      render();
    });
}

function uniq(arr) {
  var seen = {}, out = [];
  arr.forEach(function (v) {
    var k = String(v).trim().toLowerCase();
    if (!k || seen[k]) return;
    seen[k] = 1; out.push(v);
  });
  return out;
}

function init() {
  fillDatalist("merchantsList", locais);
  fillDatalist("categoriesList", categorias);
  document.getElementById("data").value = new Date().toISOString().slice(0, 10);

  if (!sheetsOK) {
    setStatus("", "Modo local — só neste dispositivo (configura o Apps Script para partilhar com a Nadine)");
  }
  wireEvents();
  refresh();
  if (sheetsOK) setInterval(refresh, 20000);
}

function wireEvents() {
  document.getElementById("pagoPorToggle").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-p]");
    if (!btn) return;
    pendingPayer = btn.getAttribute("data-p");
    Array.prototype.forEach.call(this.querySelectorAll("button"), function (b) {
      b.setAttribute("data-active", b === btn ? "1" : "0");
    });
  });

  var pct1 = document.getElementById("pct1"), pct2 = document.getElementById("pct2");
  pct1.addEventListener("input", function () { pct2.value = Math.max(0, 100 - (parseFloat(pct1.value) || 0)); });
  pct2.addEventListener("input", function () { pct1.value = Math.max(0, 100 - (parseFloat(pct2.value) || 0)); });

  document.getElementById("local").addEventListener("change", function () {
    var catField = document.getElementById("categoria");
    var match = MERCH_CAT[this.value.trim()];
    if (match && !catField.value) catField.value = match;
  });

  document.getElementById("saveBtn").addEventListener("click", handleSave);
  document.getElementById("entriesList").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-del]");
    if (!btn) return;
    handleDelete(btn.getAttribute("data-del"));
  });
}

function handleSave() {
  if (saving) return;
  var valor = parseFloat(document.getElementById("valor").value);
  var local = document.getElementById("local").value.trim();
  var categoria = document.getElementById("categoria").value.trim();
  var data = document.getElementById("data").value;
  var pct1 = parseFloat(document.getElementById("pct1").value);
  var pct2 = parseFloat(document.getElementById("pct2").value);

  if (!valor || valor <= 0 || !local || !categoria || !pendingPayer || !data) {
    alert("Preenche todos os campos antes de guardar.");
    return;
  }
  if (Math.round(pct1 + pct2) !== 100) {
    alert("A soma das percentagens tem de ser 100%.");
    return;
  }

  var entry = { data: data, valor: valor, local: local, categoria: categoria, pct1: pct1, pct2: pct2, pagoPor: pendingPayer };
  var saveBtn = document.getElementById("saveBtn");
  saving = true; saveBtn.disabled = true; saveBtn.textContent = "A guardar…";

  function resetForm() {
    document.getElementById("valor").value = "";
    document.getElementById("local").value = "";
    document.getElementById("categoria").value = "";
    document.getElementById("pct1").value = 50;
    document.getElementById("pct2").value = 50;
    pendingPayer = null;
    Array.prototype.forEach.call(document.querySelectorAll("#pagoPorToggle button"), function (b) { b.setAttribute("data-active", "0"); });
    saving = false; saveBtn.disabled = false; saveBtn.textContent = "Guardar despesa";
    document.getElementById("valor").focus();
  }

  if (!sheetsOK) {
    entry.id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(16).slice(2));
    entries.push(entry);
    saveLocal();
    render();
    resetForm();
    return;
  }

  postToSheet({ action: "add", data: data, valor: valor, local: local, categoria: categoria, pct1: pct1, pct2: pct2, pagoPor: pendingPayer })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || "erro ao guardar");
      resetForm();
      refresh();
    })
    .catch(function (err) {
      alert("Não foi possível guardar: " + err.message);
      resetForm();
    });
}

function handleDelete(id) {
  if (!sheetsOK) {
    entries = entries.filter(function (e) { return e.id !== id; });
    saveLocal();
    render();
    return;
  }
  postToSheet({ action: "delete", id: id })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error || "erro ao remover");
      refresh();
    })
    .catch(function (err) { alert("Não foi possível remover: " + err.message); });
}

// Envia com Content-Type text/plain de propósito: evita o pedido de
// "preflight" (OPTIONS) que o Apps Script não sabe responder, e que
// bloquearia o pedido todo.
function postToSheet(payload) {
  return fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })
    .then(function (r) { return r.json(); });
}

function sortedList() {
  return entries.slice().sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });
}

function euro(n) {
  return (Math.round(n * 100) / 100).toLocaleString("pt-PT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(iso) {
  var p = iso.split("-");
  return p.length === 3 ? (p[2] + "/" + p[1] + "/" + p[0]) : iso;
}
function currentMonthKey() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

function computeSummary(list) {
  var mk = currentMonthKey();
  var pagoJoao = 0, pagoNadine = 0, quotaJoao = 0, quotaNadine = 0;
  list.forEach(function (e) {
    if (e.data.slice(0, 7) !== mk) return;
    if (e.pagoPor === "JOAO") pagoJoao += e.valor; else if (e.pagoPor === "NADINE") pagoNadine += e.valor;
    quotaJoao += e.valor * e.pct1 / 100;
    quotaNadine += e.valor * e.pct2 / 100;
  });
  return { pagoJoao: pagoJoao, pagoNadine: pagoNadine, quotaJoao: quotaJoao, quotaNadine: quotaNadine, net: pagoJoao - quotaJoao };
}

function render() {
  var list = sortedList();
  var s = computeSummary(list);

  var headline;
  var hasThisMonth = list.some(function (e) { return e.data.slice(0, 7) === currentMonthKey(); });
  if (!hasThisMonth) {
    headline = "Sem despesas este mês ainda.";
  } else if (Math.abs(s.net) < 0.005) {
    headline = "Contas certas — ninguém deve nada.";
  } else if (s.net > 0) {
    headline = "Nadine deve <b>" + euro(s.net) + " €</b> a João.";
  } else {
    headline = "João deve <b>" + euro(-s.net) + " €</b> a Nadine.";
  }
  document.getElementById("headline").innerHTML = headline;

  document.getElementById("stats").innerHTML =
    "<div><span>Pago por João</span><span>" + euro(s.pagoJoao) + " €</span></div>" +
    "<div><span>Pago por Nadine</span><span>" + euro(s.pagoNadine) + " €</span></div>" +
    "<div><span>Quota João</span><span>" + euro(s.quotaJoao) + " €</span></div>" +
    "<div><span>Quota Nadine</span><span>" + euro(s.quotaNadine) + " €</span></div>";

  var recent = list.slice(0, 10);
  var ul = document.getElementById("entriesList");
  if (!recent.length) {
    ul.innerHTML = '<li class="empty">Ainda não há despesas registadas.</li>';
  } else {
    ul.innerHTML = recent.map(function (e) {
      return '<li>' +
        '<div class="entry-main">' +
          '<span class="entry-title">' + escapeHtml(e.local) + ' <span class="badge ' + e.pagoPor + '">' + PEOPLE[e.pagoPor] + '</span></span>' +
          '<span class="entry-sub">' + escapeHtml(e.categoria) + ' · ' + fmtDate(e.data) + ' · ' + e.pct1 + '/' + e.pct2 + '%</span>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<span class="entry-amount">' + euro(e.valor) + ' €</span>' +
          '<button class="entry-del" data-del="' + e.id + '" aria-label="Remover">×</button>' +
        '</div>' +
      '</li>';
    }).join("");
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
